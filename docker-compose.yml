version: "3.9"

services:
  backend:
    stdin_open: true
    tty: true
    command: tail -f /dev/null
    build:
      context: ./backend
    container_name: instagram-clone-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/:/home/instagram

  db:
    image: mariadb:10.6
    container_name: instagram-clone-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: instagram_db
      MYSQL_USER: instagram_user
      MYSQL_PASSWORD: instagram_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
    driver: local